spring.application.name=HealthLink

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/healthlink}
spring.datasource.username=${DB_USERNAME:healthlink}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

spring.docker.compose.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/healthlink}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:healthlink-api}
healthlink.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Redis: shared availability cache and Pub/Sub for live updates across instances.
# Disabled by default so the backend still runs alone; Docker Compose enables it.
healthlink.redis.enabled=${HEALTHLINK_REDIS_ENABLED:false}
healthlink.redis.host=${REDIS_HOST:localhost}
healthlink.redis.port=${REDIS_PORT:6379}
healthlink.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# Availability cache: map-search results are cached briefly and cleared after every committed status change.
healthlink.cache.enabled=${HEALTHLINK_CACHE_ENABLED:true}
healthlink.cache.availability-ttl=${HEALTHLINK_CACHE_TTL:PT60S}

# Server-Sent Events: keep-alive comments stop proxies from closing idle connections.
healthlink.live.heartbeat-interval-ms=25000
healthlink.live.max-connections=${HEALTHLINK_LIVE_MAX_CONNECTIONS:1000}
healthlink.instance-id=${HOSTNAME:local}
