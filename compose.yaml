# Backend settings shared by both application instances (a YAML anchor avoids repeating them).
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: &backend-environment
    DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    DB_USERNAME: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    SERVER_PORT: "8080"
    SPRING_DOCKER_COMPOSE_ENABLED: "false"
    FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
    KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/healthlink
    KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/healthlink/protocol/openid-connect/certs
    KEYCLOAK_AUDIENCE: healthlink-api
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    HEALTHLINK_REDIS_ENABLED: "true"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    # PostgreSQL 17 with the PostGIS extension, used for nearby (geographic) searches.
    # Multi-architecture build of the official docker-postgis image: runs natively on Apple Silicon and Intel.
    image: imresamu/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - healthlink_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - healthlink_keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/healthlink-realm.json:/opt/keycloak/data/import/healthlink-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    # Shared availability cache + Pub/Sub channel that carries live updates between instances.
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two identical, stateless application instances behind the gateway (horizontal scaling).
  backend-1:
    <<: *backend
    hostname: backend-1
    environment:
      <<: *backend-environment
      HOSTNAME: backend-1

  backend-2:
    <<: *backend
    hostname: backend-2
    environment:
      <<: *backend-environment
      HOSTNAME: backend-2

  gateway:
    # Nginx load balancer: spreads API requests across instances and keeps SSE streams open.
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: healthlink
        VITE_KEYCLOAK_CLIENT_ID: healthlink-web
        VITE_ENABLE_DESIGN_PREVIEW: ${VITE_ENABLE_DESIGN_PREVIEW:-true}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  healthlink_postgres:
  healthlink_keycloak_postgres:
