# HealthLink API gateway: load balancing across stateless Spring Boot instances.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Citizen coordinates travel in query strings, so access logs record the path only.
    log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $upstream_addr $request_time';
    access_log /dev/stdout no_query;

    upstream healthlink_api {
        # Round robin by default. An instance that fails is skipped for 10 s (passive health check).
        server backend-1:8080 max_fails=2 fail_timeout=10s;
        server backend-2:8080 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Live updates: no buffering and long timeouts so events reach the browser immediately.
        location = /api/availability/stream {
            proxy_pass http://healthlink_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://healthlink_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Retry another instance only when it failed before sending a response.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
